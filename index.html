<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>换换计时器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff8f7;
      --surface: #ffffff;
      --text: #231f20;
      --muted: #6f686b;
      --line: #f0dfe2;
      --accent: #e85f87;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
      color: var(--text);
      background: linear-gradient(180deg, #fff8f7 0%, #fff1f5 100%);
    }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 64px 0;
    }

    .panel {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 18px 45px rgba(107, 58, 72, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 7vw, 52px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 17px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }

    nav a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid #f2c9d4;
      border-radius: 999px;
      background: #fff;
    }

    footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>换换计时器</h1>
      <p>一个用于记录经期用品放置时长、设置本地提醒并查看历史统计的简单工具。</p>
      <p>本 App 仅用于个人记录和提醒，不提供医疗诊断、健康判断或安全保证。</p>

      <nav aria-label="页面导航">
        <a href="./support.html">用户支持</a>
        <a href="./privacy.html">隐私政策</a>
      </nav>
    </section>

    <footer>
      © 2026 换换计时器
    </footer>
  </main>
</body>
</html>
